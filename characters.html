<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物 · 超百女友数据站</title>
<link rel="stylesheet" href="style.css">
<style>
:root{
  --pink-main:#ff8fab;--pink-deep:#e05a7a;--pink-light:#ffe4ec;
  --white:#fff;--text:#5a3a45;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#faf5f7;color:var(--text)}
nav{display:flex;gap:16px;padding:12px 20px;background:#fff;border-bottom:2px solid var(--pink-light)}
nav a{color:var(--pink-deep);text-decoration:none;font-weight:bold}
nav a.active{color:var(--pink-main);border-bottom:2px solid var(--pink-main)}
main{max-width:1100px;margin:0 auto;padding:20px}
footer{text-align:center;padding:24px;color:#a07a86;font-size:13px}
.btn{padding:10px 18px;border:none;border-radius:10px;background:var(--pink-main);color:var(--white);font-size:15px;cursor:pointer}
.btn:hover{background:var(--pink-deep)}
.btn.ghost{background:var(--white);color:var(--pink-deep);border:2px solid var(--pink-main)}
.btn.ghost:hover{background:var(--pink-light)}
.btn.small{padding:6px 12px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}
.toolbar input[type="text"]{flex:1;min-width:180px;padding:10px 14px;border:2px solid var(--pink-main);border-radius:10px;font-size:15px;outline:none;background:var(--white);color:var(--text)}
.toolbar input[type="text"]:focus{border-color:var(--pink-deep)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px;margin-top:20px}
.char-card{position:relative;text-align:center;cursor:pointer;transition:transform 0.2s;z-index:1}
.char-card:hover{transform:translateY(-4px);z-index:100}
.char-avatar{width:130px;height:130px;border-radius:50%;background:var(--pink-light);margin:0 auto;overflow:hidden;border:4px solid var(--pink-main);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--pink-deep);font-weight:bold}
.char-avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(100%);transition:filter 0.3s;pointer-events:none}
.char-card:hover .char-avatar img{filter:grayscale(0%)}
.char-hover-info{position:absolute;left:50%;bottom:-8px;transform:translate(-50%,100%);background:rgba(90,58,69,0.96);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;width:240px;text-align:left;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:9999;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.char-hover-info .hi-name{font-size:15px;font-weight:bold;color:#ffd6e3;margin-bottom:6px}
.char-hover-info .hi-intro{color:#ffe4ec;margin-bottom:6px}
.char-hover-info .hi-tags{color:#ffd6e3;font-size:12px;line-height:1.5}
.char-card:hover .char-hover-info{opacity:1}
.char-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--white);color:var(--pink-deep);border:2px solid var(--pink-main);border-radius:16px;font-size:13px}
.grid-view.hidden,.browse-view.hidden{display:none !important}
.status-bar{font-size:13px;color:#a07a86;margin:8px 0}
.status-bar.error{color:#c94a4a;font-weight:bold}
/* 浏览：桌面子页面 / 手机铺满 */
.browse-view{position:relative;width:100%;box-sizing:border-box;background:#f8f8f8;z-index:1;padding:0;margin:0;display:block}
.browse-view.browse-mobile{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;overflow-y:auto;background:#f8f8f8}
.browse-root{width:100%;box-sizing:border-box;padding:0;margin:0;background:#fff;min-height:0}
.browse-view.browse-mobile .browse-root{min-height:100%}
.browse-shell{max-width:820px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(90,58,69,0.12);overflow:hidden}
.browse-view.browse-mobile .browse-shell{max-width:none;margin:0;border-radius:0;box-shadow:none;min-height:100%}
.clothes-extra-bar{background:#fff8fb;border:1px dashed var(--pink-main);border-radius:8px;padding:8px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clothes-extra-bar .bar-label{font-size:11px;color:var(--pink-deep);font-weight:bold}
.filter-tag-chip,.acc-chip,.variant-chip,.display-tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#fff;border:1px solid var(--pink-main);border-radius:12px;font-size:11px;cursor:pointer;user-select:none;color:var(--pink-deep)}
.filter-tag-chip.active,.acc-chip.active,.variant-chip.active{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep);font-weight:bold}
.display-tag-chip{cursor:help}
.dressup-layer{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dressup-layer img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<nav>
<a href="index.html">首页</a>
<a href="chapters.html">章节</a>
<a href="characters.html" class="active">人物</a>
</nav>
<main>
<div id="gridView" class="grid-view">
  <h1>👧 人物介绍</h1>
  <div class="toolbar">
    <input type="text" id="charSearch" placeholder="搜索角色名 / 介绍 / 标签">
    <button class="btn ghost" type="button" onclick="clearCharSearch()">清除</button>
  </div>
  <div class="status-bar" id="loadStatus">正在加载 characters-data.json …</div>
  <div class="char-grid" id="charGrid"></div>
</div>
<div id="browseView" class="browse-view hidden">
  <div id="browseRoot" class="browse-root"></div>
</div>
</main>
<footer>粉丝向非官方数据站 · 仅用于学习交流 · 只读浏览</footer>
<script>
const DATA_URL='characters-data.json';
const FOLDER_AVATAR='image/picture/';
const FOLDER_BODY='image/body/';
const FOLDER_HAIR='image/hair/';
const FOLDER_FACE='image/face/';
const FOLDER_CLOTHES='image/clothes/';
const FOLDER_ACC='image/clothes/';

const MODULE_HEIGHT_RATIOS={
  title:0.12,avatar:1.0,name:0.12,intro:0.25,tags:0.17,
  dressupStage:1.5,
  dressupNavPrevChar:0.8,dressupNavNextChar:0.8,
  dressupNavPrevBody:0.8,dressupNavNextBody:0.8,
  dressupNavPrevHair:0.8,dressupNavNextHair:0.8,
  dressupNavPrevFace:0.8,dressupNavNextFace:0.8,
  dressupNavPrevClothes:0.8,dressupNavNextClothes:0.8,
  dressupExtraBar:0.5,
  infoField:0.17,ownInfo:0.42,ownCounter:0.39,
  button:0.1,text:0.17,spacer:0.06
};
const HEIGHT_MIGRATE_REF=360;
const ACC_LAYERS=[{key:'underBackHair',label:'后发下'},{key:'underClothes',label:'衣服下后发上'},{key:'underFrontHair',label:'衣服上前发下'},{key:'overFrontHair',label:'前发上'}];
const ACC_LAYER_LABEL={};ACC_LAYERS.forEach(l=>ACC_LAYER_LABEL[l.key]=l.label);
const BROWSE_BTN_ACTIONS={
  back:{label:'← 返回列表',fn:'browseGoBack()',cls:'ghost'},
  edit:{label:'← 返回列表',fn:'browseGoBack()',cls:'ghost'},
  prevChar:{label:'◀ 上一个角色',fn:'browsePrevChar()',cls:'ghost'},
  nextChar:{label:'下一个角色 ▶',fn:'browseNextChar()',cls:'ghost'},
  uidesign:{label:'',fn:'',cls:'ghost'}
};
const KIND_LABELS={char:'角色',body:'身体',hair:'发型',face:'表情',clothes:'衣服'};

function detectDevice(){
  try{ if(window.matchMedia && window.matchMedia('(max-width: 768px)').matches) return 'mobile'; }catch(e){}
  if(/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent||'')) return 'mobile';
  return 'desktop';
}
function getDefaultHeightRatio(t){return MODULE_HEIGHT_RATIOS[t]!=null?MODULE_HEIGHT_RATIOS[t]:0.17;}
function genId(){return 'x'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
function genSetId(){return 's'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escapeAttr(s){return escapeHtml(s);}
function sortTagsByWeight(tags){
  const indexed=(tags||[]).map((t,i)=>({t,i}));
  indexed.sort((a,b)=>{
    const wa=(a.t.weight!=null&&a.t.weight!==''&&!isNaN(a.t.weight))?Number(a.t.weight):-Infinity;
    const wb=(b.t.weight!=null&&b.t.weight!==''&&!isNaN(b.t.weight))?Number(b.t.weight):-Infinity;
    if(wa!==wb) return wb-wa;
    return a.i-b.i;
  });
  return indexed.map(x=>x.t);
}

function makeContainer(direction){
  return {id:genId(),kind:'container',direction:direction||'column',justify:'left',align:'stretch',wrap:false,gap:8,padding:0,bgColor:'',widthPercent:100,heightRatio:null,alignSelf:'auto',children:[]};
}
function makeModule(type,props){
  return {id:genId(),kind:'module',type:type,props:props||{},widthPercent:100,heightRatio:getDefaultHeightRatio(type),alignSelf:'auto'};
}
function makeTag(name,note,weight){return {id:genId(),name:name||'',note:note||'',weight:(weight!=null&&weight!==''&&!isNaN(weight))?Number(weight):null};}
function makeBody(name,file,note){return {id:genSetId(),name:name||'默认',file:file||'',headFile:'',torsoFile:'',handFile:'',footFile:'',note:note||'',hairSets:[],faceSets:[],clothesSets:[]};}

function walkTree(node,cb,parent){cb(node,parent||null);if(node.children)node.children.forEach(c=>walkTree(c,cb,node));}
function normalizeModuleHeight(node){
  if(!node||node.kind!=='module')return node;
  if(node.heightRatio!=null&&!isNaN(node.heightRatio)&&node.heightRatio>0)node.heightRatio=Number(node.heightRatio);
  else if(node.height!=null&&!isNaN(node.height)&&Number(node.height)>0)node.heightRatio=Math.max(0.02,Number(node.height)/HEIGHT_MIGRATE_REF);
  else node.heightRatio=getDefaultHeightRatio(node.type);
  delete node.height;
  return node;
}
function applyModuleSizeStyle(el,node){
  const pct=Math.max(1,Math.min(100,node.widthPercent||100));
  el.style.width=pct+'%';
  el.style.flexShrink='1';
  el.style.minWidth='0';
  const ratio=(node.heightRatio!=null&&!isNaN(node.heightRatio)&&node.heightRatio>0)?Number(node.heightRatio):getDefaultHeightRatio(node.type);
  el.style.height='auto';
  el.style.aspectRatio='1 / '+ratio;
  el.style.overflow='hidden';
}
function applyContainerSizeStyle(el,node,isRoot){
  const pct=Math.max(1,Math.min(100,node.widthPercent!=null?Number(node.widthPercent):100));
  if(isRoot) el.style.width='100%';
  else{el.style.width=pct+'%';el.style.flexShrink='1';el.style.minWidth='0';}
  if(node.alignSelf==='flex-start') el.style.alignSelf='flex-start';
  else if(node.alignSelf==='center') el.style.alignSelf='center';
  else if(node.alignSelf==='flex-end') el.style.alignSelf='flex-end';
  else if(node.alignSelf==='stretch') el.style.alignSelf='stretch';
  else el.style.alignSelf='auto';
  if(node.heightRatio!=null&&!isNaN(node.heightRatio)&&Number(node.heightRatio)>0){
    el.style.aspectRatio='1 / '+Number(node.heightRatio);
    el.style.overflow='hidden';
    if(!isRoot) el.style.minHeight='0';
  }else{
    el.style.aspectRatio='';
    el.style.minHeight=isRoot?'':'28px';
  }
}

function buildDefaultLayoutTree(device){
  const root=makeContainer('column');root.gap=8;root.padding=8;
  const headerRow=makeContainer('row');headerRow.justify='space-between';headerRow.gap=6;headerRow.padding=0;
  headerRow.children=[
    Object.assign(makeModule('title'),{widthPercent:46}),
    Object.assign(makeModule('button',{action:'back'}),{widthPercent:24}),
    Object.assign(makeModule('button',{action:'prevChar'}),{widthPercent:24})
  ];
  root.children.push(headerRow);
  const avatarRow=makeContainer('row');avatarRow.justify='center';avatarRow.padding=0;
  avatarRow.children=[Object.assign(makeModule('avatar'),{widthPercent:device==='mobile'?40:30})];
  root.children.push(avatarRow);
  const addSimpleRow=(type,props)=>{const row=makeContainer('row');row.padding=0;row.children=[Object.assign(makeModule(type,props),{widthPercent:100})];root.children.push(row);};
  addSimpleRow('name');addSimpleRow('intro');addSimpleRow('tags');
  const dressupPanel=makeContainer('column');dressupPanel.padding=6;dressupPanel.gap=6;dressupPanel.bgColor='#fff8fb';
  const stageRow=makeContainer('row');stageRow.justify='center';stageRow.padding=0;
  stageRow.children=[Object.assign(makeModule('dressupStage'),{widthPercent:100})];
  dressupPanel.children.push(stageRow);
  const navPrevRow=makeContainer('row');navPrevRow.justify='space-between';navPrevRow.gap=3;navPrevRow.padding=0;
  ['Char','Body','Hair','Face','Clothes'].forEach(k=>{navPrevRow.children.push(Object.assign(makeModule('dressupNavPrev'+k),{widthPercent:18}));});
  dressupPanel.children.push(navPrevRow);
  const navNextRow=makeContainer('row');navNextRow.justify='space-between';navNextRow.gap=3;navNextRow.padding=0;
  ['Char','Body','Hair','Face','Clothes'].forEach(k=>{navNextRow.children.push(Object.assign(makeModule('dressupNavNext'+k),{widthPercent:18}));});
  dressupPanel.children.push(navNextRow);
  const barRow=makeContainer('row');barRow.padding=0;
  barRow.children=[Object.assign(makeModule('dressupExtraBar'),{widthPercent:100,heightRatio:0.5})];
  dressupPanel.children.push(barRow);
  root.children.push(dressupPanel);
  const fields=(typeof data!=='undefined'&&data.infoFields)||[];
  fields.forEach(f=>addSimpleRow('infoField',{fieldId:f.id}));
  addSimpleRow('ownInfo');
  return root;
}

function migrateLayoutTree(oldLayout){
  if(!oldLayout)return null;
  if(oldLayout.tree){
    const layout=JSON.parse(JSON.stringify(oldLayout));
    if(layout.tree) walkTree(layout.tree,n=>{if(n.kind==='module')normalizeModuleHeight(n);});
    return layout;
  }
  if(!Array.isArray(oldLayout.modules)) return null;
  const root=makeContainer('column');root.gap=6;root.padding=8;
  oldLayout.modules.forEach(m=>{
    const row=makeContainer('row');
    if(m.alignX==='right') row.justify='right';
    else if(m.alignX==='center') row.justify='center';
    else row.justify='left';
    row.padding=0;
    const leaf=makeModule(m.type,m.props);
    if(m.widthMode==='percent') leaf.widthPercent=m.widthPercent||100;
    else leaf.widthPercent=100;
    if(m.heightRatio!=null) leaf.heightRatio=Number(m.heightRatio);
    else if(m.height!=null) leaf.heightRatio=Math.max(0.02,Number(m.height)/HEIGHT_MIGRATE_REF);
    else leaf.heightRatio=getDefaultHeightRatio(m.type);
    delete leaf.height;
    row.children.push(leaf);
    root.children.push(row);
  });
  return {version:7,tree:root};
}
function getEffectiveLayoutTree(char,device){
  const charLayout=device==='mobile'?char?.uiLayoutMobile:char?.uiLayoutDesktop;
  const globalLayout=device==='mobile'?data.globalUILayoutMobile:data.globalUILayoutDesktop;
  let layout=migrateLayoutTree(charLayout)||migrateLayoutTree(globalLayout);
  if(!layout) layout={version:7,tree:buildDefaultLayoutTree(device)};
  const cloned=JSON.parse(JSON.stringify(layout));
  if(cloned.tree) walkTree(cloned.tree,n=>{if(n.kind==='module')normalizeModuleHeight(n);});
  return cloned;
}
function syncTreeWithInfoFields(tree){
  const existing=new Set();
  walkTree(tree,n=>{if(n.kind==='module'&&n.type==='infoField'&&n.props.fieldId)existing.add(n.props.fieldId);});
  const miss=((data.infoFields)||[]).filter(f=>!existing.has(f.id));
  miss.forEach(f=>{
    const row=makeContainer('row');row.padding=0;
    row.children=[Object.assign(makeModule('infoField',{fieldId:f.id}),{widthPercent:100})];
    tree.children.push(row);
  });
  return tree;
}

function migrateFieldArr(a){if(!Array.isArray(a))return [];return a.map(f=>typeof f==='string'?{id:genId(),name:f,note:''}:{id:f.id||genId(),name:f.name||'',note:f.note||''});}
function migrateTags(a){if(!Array.isArray(a))return [];return a.map(t=>{if(typeof t==='string')return makeTag(t,'');return {id:t.id||genId(),name:t.name||'',note:t.note||'',weight:(t.weight!=null&&t.weight!==''&&!isNaN(t.weight))?Number(t.weight):null};});}
function migrateHair(h){return {id:h.id||genSetId(),name:h.name||'未命名发型',frontHairFile:h.frontHairFile||'',backHairFile:h.backHairFile||'',note:h.note||'',tagIds:Array.isArray(h.tagIds)?h.tagIds:[],defaultClothesId:h.defaultClothesId||'',unbound:!!h.unbound};}
function migrateFace(f){return {id:f.id||genSetId(),name:f.name||'未命名表情',imageFile:f.imageFile||'',note:f.note||''};}
function migrateGlobalAcc(a){return {id:a.id||genId(),name:a.name||'未命名装饰',note:a.note||'',imageFile:a.imageFile||'',layer:(a.layer&&ACC_LAYER_LABEL[a.layer])?a.layer:'underFrontHair',defaultOn:!!a.defaultOn};}
function migratePerAcc(pa){return {id:pa.id||genSetId(),name:pa.name||'未命名装饰',imageFile:pa.imageFile||'',note:pa.note||'',layer:(pa.layer&&ACC_LAYER_LABEL[pa.layer])?pa.layer:'underFrontHair',defaultOn:!!pa.defaultOn};}
function migrateClothes(c){return {id:c.id||genSetId(),name:c.name||'未命名衣服',imageFile:c.imageFile||'',note:c.note||'',tagIds:Array.isArray(c.tagIds)?c.tagIds:[],hasGlobalAccessories:!!c.hasGlobalAccessories,enabledGlobalAccessoryIds:Array.isArray(c.enabledGlobalAccessoryIds)?c.enabledGlobalAccessoryIds:[],activeGlobalAccessoryIds:Array.isArray(c.activeGlobalAccessoryIds)?c.activeGlobalAccessoryIds:[],hasPerClothesAccessories:!!c.hasPerClothesAccessories,perClothesAccessories:Array.isArray(c.perClothesAccessories)?c.perClothesAccessories.map(migratePerAcc):[],activePerClothesAccessoryIds:Array.isArray(c.activePerClothesAccessoryIds)?c.activePerClothesAccessoryIds:[],hasVariants:!!c.hasVariants,variants:Array.isArray(c.variants)?c.variants:[],activeVariantIndex:c.activeVariantIndex||0,hideBackHair:!!c.hideBackHair,hideHead:!!c.hideHead,hideTorso:!!c.hideTorso,hideHand:!!c.hideHand,hideFoot:!!c.hideFoot};}
function migrateBody(b){return {id:b.id||genSetId(),name:b.name||'默认',file:b.file||'',headFile:b.headFile||'',torsoFile:b.torsoFile||'',handFile:b.handFile||'',footFile:b.footFile||'',note:b.note||'',hairSets:Array.isArray(b.hairSets)?b.hairSets.map(migrateHair):[],faceSets:Array.isArray(b.faceSets)?b.faceSets.map(migrateFace):[],clothesSets:Array.isArray(b.clothesSets)?b.clothesSets.map(migrateClothes):[]};}
function syncDefaultAccessories(clothes,charAccs){
  if(!clothes) return;
  if(clothes.hasGlobalAccessories){
    const enabled=clothes.enabledGlobalAccessoryIds||[];
    const active=new Set(clothes.activeGlobalAccessoryIds||[]);
    enabled.forEach(gid=>{const g=(charAccs||[]).find(x=>x.id===gid);if(g&&g.defaultOn) active.add(gid);});
    clothes.activeGlobalAccessoryIds=Array.from(active);
  }
  if(clothes.hasPerClothesAccessories){
    const active=new Set(clothes.activePerClothesAccessoryIds||[]);
    (clothes.perClothesAccessories||[]).forEach(pa=>{if(pa.defaultOn) active.add(pa.id);});
    clothes.activePerClothesAccessoryIds=Array.from(active);
  }
}
function normalizeCharacter(c){
  const nc={id:c.id||genId(),name:c.name||'',intro:c.intro||'',avatarFile:c.avatarFile||'',tags:migrateTags(c.tags),bodies:[],globalAccessories:Array.isArray(c.globalAccessories)?c.globalAccessories.map(migrateGlobalAcc):[],ownInfoFields:migrateFieldArr(c.ownInfoFields),ownInfo:Object.assign({},c.ownInfo||{}),customCounters:migrateFieldArr(c.customCounters),info:c.info||{},uiLayoutDesktop:migrateLayoutTree(c.uiLayoutDesktop||c.uiLayout),uiLayoutMobile:migrateLayoutTree(c.uiLayoutMobile)};
  if(Array.isArray(c.bodies)&&c.bodies.length>0) nc.bodies=c.bodies.map(migrateBody);
  else{
    const b=makeBody('默认',c.body?.file||'',c.body?.note||'');
    b.hairSets=Array.isArray(c.hairSets)?c.hairSets.map(migrateHair):[];
    b.faceSets=Array.isArray(c.faceSets)?c.faceSets.map(migrateFace):[];
    b.clothesSets=Array.isArray(c.clothesSets)?c.clothesSets.map(migrateClothes):[];
    nc.bodies=[b];
  }
  return nc;
}
function defaultData(){return {characters:[],infoFields:[],customCounters:[],clothesTags:[],hairTags:[],globalAccessories:[],globalUILayoutDesktop:null,globalUILayoutMobile:null};}
function parseDataObject(d){
  const r={
    characters:(d.characters||[]).map(normalizeCharacter),
    infoFields:migrateFieldArr(d.infoFields),
    customCounters:migrateFieldArr(d.customCounters),
    clothesTags:migrateTags(d.clothesTags),
    hairTags:migrateTags(d.hairTags),
    globalAccessories:Array.isArray(d.globalAccessories)?d.globalAccessories.map(migrateGlobalAcc):[],
    globalUILayoutDesktop:migrateLayoutTree(d.globalUILayoutDesktop||d.globalUILayout),
    globalUILayoutMobile:migrateLayoutTree(d.globalUILayoutMobile)
  };
  if(r.hairTags.length===0){
    const allOld=[];
    (d.characters||[]).forEach(c=>{if(Array.isArray(c.hairTags)){c.hairTags.forEach(t=>{const tag=migrateTags([t])[0];if(!allOld.some(x=>x.name===tag.name)) allOld.push(tag);});}});
    r.hairTags=allOld;
  }
  return r;
}

let data=defaultData();
let charSearchTerm='';
let currentHairFilterTagId=null;
let currentClothesFilterTagId=null;
let browseChar=null;
let browseBodies=[],browseBodyIdx=0,browseHairIdx=0,browseFaceIdx=0,browseClothesIdx=0;

function setLoadStatus(msg,isError){
  const el=document.getElementById('loadStatus');
  if(!el) return;
  el.textContent=msg;
  el.classList.toggle('error',!!isError);
}

async function loadFromRepo(){
  setLoadStatus('正在加载 characters-data.json …',false);
  try{
    const res=await fetch(DATA_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    data=parseDataObject(json);
    setLoadStatus('已加载 '+data.characters.length+' 名角色（只读）',false);
    renderCharGrid();
  }catch(err){
    data=defaultData();
    setLoadStatus('无法读取 characters-data.json：'+err.message+'。请将数据文件放在同目录后刷新。',true);
    renderCharGrid();
  }
}

function showView(view){
  document.getElementById('gridView').classList.toggle('hidden',view!=='grid');
  const bv=document.getElementById('browseView');
  bv.classList.toggle('hidden',view!=='browse');
  if(view==='browse'){
    const mobile=detectDevice()==='mobile';
    bv.classList.toggle('browse-mobile',mobile);
    document.body.style.overflow=mobile?'hidden':'';
  }else{
    bv.classList.remove('browse-mobile');
    document.body.style.overflow='';
  }
}

function renderCharGrid(){
  const grid=document.getElementById('charGrid');
  grid.innerHTML='';
  const term=charSearchTerm.trim();
  const filtered=data.characters.filter(c=>{
    if(!term) return true;
    if(c.name&&c.name.includes(term)) return true;
    if(c.intro&&c.intro.includes(term)) return true;
    if(Array.isArray(c.tags)&&c.tags.some(t=>t.name.includes(term))) return true;
    return false;
  });
  if(filtered.length===0){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#a07a86;padding:40px;">没有匹配的角色</div>';
    return;
  }
  filtered.forEach(c=>{
    const card=document.createElement('div');
    card.className='char-card';
    const src=c.avatarFile?FOLDER_AVATAR+c.avatarFile:'';
    const ah=src?`<img src="${src}" alt="" onerror="this.style.display='none';this.parentNode.innerHTML='<span>?</span>'">`:`<span>${escapeHtml((c.name||'?').slice(0,1))}</span>`;
    const tagsLine=(c.tags&&c.tags.length)?`<div class="hi-tags">${c.tags.map(t=>{const ttl=t.note?` title="${escapeAttr(t.note)}"`:'';return `<span${ttl}>#${escapeHtml(t.name)}</span>`;}).join(' ')}</div>`:'';
    card.innerHTML=`<div class="char-avatar">${ah}</div><div class="char-hover-info"><div class="hi-name">${escapeHtml(c.name||'未命名')}</div><div class="hi-intro">${escapeHtml(c.intro||'（暂无介绍）')}</div>${tagsLine}</div>`;
    card.addEventListener('click',()=>openBrowsePage(c.id));
    grid.appendChild(card);
  });
}
function clearCharSearch(){document.getElementById('charSearch').value='';charSearchTerm='';renderCharGrid();}
document.getElementById('charSearch').addEventListener('input',e=>{charSearchTerm=e.target.value;renderCharGrid();});

function cloneForBrowse(bodies){
  return (bodies||[]).map(b=>({id:b.id,name:b.name||'',file:b.file||'',headFile:b.headFile||'',torsoFile:b.torsoFile||'',handFile:b.handFile||'',footFile:b.footFile||'',note:b.note||'',hairSets:(b.hairSets||[]).map(h=>({...h,tagIds:[...(h.tagIds||[])]})),faceSets:(b.faceSets||[]).map(f=>({...f})),clothesSets:(b.clothesSets||[]).map(c=>({...c,tagIds:[...(c.tagIds||[])],enabledGlobalAccessoryIds:[...(c.enabledGlobalAccessoryIds||[])],activeGlobalAccessoryIds:[...(c.activeGlobalAccessoryIds||[])],perClothesAccessories:(c.perClothesAccessories||[]).map(p=>({...p})),activePerClothesAccessoryIds:[...(c.activePerClothesAccessoryIds||[])],variants:(c.variants||[]).map(v=>({...v}))}))}));
}
function ensureBrowseMatchesFilter(){
  const body=browseBodies[browseBodyIdx];if(!body)return;
  if(currentHairFilterTagId){const filtered=body.hairSets.filter(h=>(h.tagIds||[]).includes(currentHairFilterTagId));if(filtered.length>0){const cur=body.hairSets[browseHairIdx];if(!filtered.includes(cur)) browseHairIdx=body.hairSets.indexOf(filtered[0]);}}
  if(currentClothesFilterTagId){const filtered=body.clothesSets.filter(c=>(c.tagIds||[]).includes(currentClothesFilterTagId));if(filtered.length>0){const cur=body.clothesSets[browseClothesIdx];if(!filtered.includes(cur)) browseClothesIdx=body.clothesSets.indexOf(filtered[0]);}}
}
function openBrowsePage(charId){
  const c=data.characters.find(x=>x.id===charId);if(!c)return;
  browseChar=c;browseBodies=cloneForBrowse(c.bodies||[]);
  const accs=c.globalAccessories||[];
  browseBodies.forEach(b=>b.clothesSets.forEach(cl=>syncDefaultAccessories(cl,accs)));
  browseBodyIdx=0;browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;
  ensureBrowseMatchesFilter();
  showView('browse');renderBrowseCanvas();window.scrollTo({top:0,behavior:'smooth'});
}
function browseGoBack(){browseChar=null;browseBodies=[];showView('grid');renderCharGrid();}
function browsePrevChar(){if(!browseChar)return;const idx=data.characters.findIndex(c=>c.id===browseChar.id);const prev=data.characters[(idx-1+data.characters.length)%data.characters.length];if(prev) openBrowsePage(prev.id);}
function browseNextChar(){if(!browseChar)return;const idx=data.characters.findIndex(c=>c.id===browseChar.id);const next=data.characters[(idx+1)%data.characters.length];if(next) openBrowsePage(next.id);}
function browseNavClick(kind,dir){
  if(!browseChar)return;
  if(kind==='char'){if(dir==='prev')browsePrevChar();else browseNextChar();return;}
  const body=browseBodies[browseBodyIdx];if(!body)return;
  if(kind==='body'){browseBodyIdx=dir==='prev'?(browseBodyIdx-1+browseBodies.length)%browseBodies.length:(browseBodyIdx+1)%browseBodies.length;browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;ensureBrowseMatchesFilter();}
  else if(kind==='hair'){const filtered=currentHairFilterTagId?body.hairSets.filter(h=>(h.tagIds||[]).includes(currentHairFilterTagId)):body.hairSets;if(filtered.length>0){const cur=body.hairSets[browseHairIdx];const fidx=filtered.indexOf(cur);const nextItem=fidx===-1?(dir==='prev'?filtered[filtered.length-1]:filtered[0]):filtered[(fidx+(dir==='prev'?-1:1)+filtered.length)%filtered.length];browseHairIdx=body.hairSets.indexOf(nextItem);}}
  else if(kind==='face'){const len=body.faceSets.length;if(len>0)browseFaceIdx=dir==='prev'?(browseFaceIdx-1+len)%len:(browseFaceIdx+1)%len;}
  else if(kind==='clothes'){const filtered=currentClothesFilterTagId?body.clothesSets.filter(c=>(c.tagIds||[]).includes(currentClothesFilterTagId)):body.clothesSets;if(filtered.length>0){const cur=body.clothesSets[browseClothesIdx];const fidx=filtered.indexOf(cur);const nextItem=fidx===-1?(dir==='prev'?filtered[filtered.length-1]:filtered[0]):filtered[(fidx+(dir==='prev'?-1:1)+filtered.length)%filtered.length];browseClothesIdx=body.clothesSets.indexOf(nextItem);}}
  const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);
}
function browseSetVariant(i){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;c.activeVariantIndex=i;const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseToggleGlobalAcc(gid){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;if(!c.activeGlobalAccessoryIds)c.activeGlobalAccessoryIds=[];const k=c.activeGlobalAccessoryIds.indexOf(gid);if(k===-1)c.activeGlobalAccessoryIds.push(gid);else c.activeGlobalAccessoryIds.splice(k,1);const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseTogglePerAcc(paId){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;if(!c.activePerClothesAccessoryIds)c.activePerClothesAccessoryIds=[];const k=c.activePerClothesAccessoryIds.indexOf(paId);if(k===-1)c.activePerClothesAccessoryIds.push(paId);else c.activePerClothesAccessoryIds.splice(k,1);const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseSetHairFilter(tagId){currentHairFilterTagId=currentHairFilterTagId===tagId?null:tagId;ensureBrowseMatchesFilter();const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseSetClothesFilter(tagId){currentClothesFilterTagId=currentClothesFilterTagId===tagId?null:tagId;ensureBrowseMatchesFilter();const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}

function getBrowsePreview(){return {char:browseChar,bodies:browseBodies,bodyIdx:browseBodyIdx,hairIdx:browseHairIdx,faceIdx:browseFaceIdx,clothesIdx:browseClothesIdx};}

function renderDressupLayers(stage,ctx){
  stage.innerHTML='';
  const {body,hair,face,clothes,charAccs,enabledGlobalAccIds,activeGlobalAccIds,activePerAccIds}=ctx;
  const hideBackHair=!!(clothes&&clothes.hideBackHair);
  const hideHead=!!(clothes&&clothes.hideHead);
  const hideTorso=!!(clothes&&clothes.hideTorso);
  const hideHand=!!(clothes&&clothes.hideHand);
  const hideFoot=!!(clothes&&clothes.hideFoot);
  const accByLayer={underBackHair:[],underClothes:[],underFrontHair:[],overFrontHair:[]};
  if(clothes&&clothes.hasPerClothesAccessories){(clothes.perClothesAccessories||[]).forEach(pa=>{if((activePerAccIds||[]).includes(pa.id)&&pa.imageFile){const layer=accByLayer[pa.layer]?pa.layer:'underFrontHair';accByLayer[layer].push(FOLDER_ACC+pa.imageFile);}});}
  if(clothes&&clothes.hasGlobalAccessories){(charAccs||[]).forEach(g=>{const enabled=(enabledGlobalAccIds||[]).includes(g.id);const active=(activeGlobalAccIds||[]).includes(g.id);if(enabled&&active&&g.imageFile){const layer=accByLayer[g.layer]?g.layer:'underFrontHair';accByLayer[layer].push(FOLDER_ACC+g.imageFile);}});}
  const addImg=(src)=>{if(!src)return;const div=document.createElement('div');div.className='dressup-layer';const img=document.createElement('img');img.src=src;img.onerror=()=>{img.style.display='none';};div.appendChild(img);stage.appendChild(div);};
  accByLayer.underBackHair.forEach(src=>addImg(src));
  if(!hideBackHair&&hair?.backHairFile)addImg(FOLDER_HAIR+hair.backHairFile);
  accByLayer.underClothes.forEach(src=>addImg(src));
  if(body){
    const hasParts=body.headFile||body.torsoFile||body.handFile||body.footFile;
    if(!hasParts&&body.file) addImg(FOLDER_BODY+body.file);
    else{
      if(!hideTorso&&body.torsoFile)addImg(FOLDER_BODY+body.torsoFile);
      if(!hideFoot&&body.footFile)addImg(FOLDER_BODY+body.footFile);
      if(!hideHand&&body.handFile)addImg(FOLDER_BODY+body.handFile);
      if(!hideHead&&body.headFile)addImg(FOLDER_BODY+body.headFile);
    }
  }
  if(face?.imageFile)addImg(FOLDER_FACE+face.imageFile);
  if(clothes?.imageFile)addImg(FOLDER_CLOTHES+clothes.imageFile);
  if(clothes&&clothes.hasVariants&&clothes.variants.length>0){const v=clothes.variants[clothes.activeVariantIndex||0];if(v&&v.imageFile)addImg(FOLDER_CLOTHES+v.imageFile);}
  accByLayer.underFrontHair.forEach(src=>addImg(src));
  if(hair?.frontHairFile)addImg(FOLDER_HAIR+hair.frontHairFile);
  accByLayer.overFrontHair.forEach(src=>addImg(src));
  if(stage.children.length===0){
    const h=document.createElement('div');h.className='dressup-layer';
    h.innerHTML='<span style="color:var(--pink-deep);opacity:0.5;font-size:13px;">暂无立绘资源</span>';
    stage.appendChild(h);
  }
}

function renderBrowseCanvas(){
  const root=document.getElementById('browseRoot');if(!root||!browseChar)return;
  const device=detectDevice();
  const layout=getEffectiveLayoutTree(browseChar,device);
  const tree=syncTreeWithInfoFields(layout.tree);
  const pv=getBrowsePreview();
  root.innerHTML='';
  const shell=document.createElement('div');
  shell.className='browse-shell';
  shell.appendChild(renderTree(tree,pv,true));
  root.appendChild(shell);
}
function renderTree(node,pv,isRoot){
  const el=document.createElement('div');
  el.style.boxSizing='border-box';
  if(node.kind==='container'){
    el.style.display='flex';
    el.style.flexDirection=node.direction==='row'?'row':'column';
    el.style.justifyContent=({'left':'flex-start','center':'center','right':'flex-end','space-between':'space-between','space-around':'space-around'})[node.justify]||'flex-start';
    el.style.alignItems=({'top':'flex-start','center':'center','bottom':'flex-end','stretch':'stretch'})[node.align]||'stretch';
    el.style.flexWrap=node.wrap?'wrap':'nowrap';
    el.style.gap=(node.gap||0)+'px';
    el.style.padding=(node.padding||0)+'px';
    applyContainerSizeStyle(el,node,!!isRoot);
    if(node.bgColor) el.style.background=node.bgColor;
    node.children.forEach(c=>el.appendChild(renderTree(c,pv,false)));
  }else{
    applyModuleSizeStyle(el,node);
    if(node.alignSelf==='flex-start') el.style.alignSelf='flex-start';
    else if(node.alignSelf==='center') el.style.alignSelf='center';
    else if(node.alignSelf==='flex-end') el.style.alignSelf='flex-end';
    else if(node.alignSelf==='stretch') el.style.alignSelf='stretch';
    el.innerHTML=renderModuleInner(node,pv);
  }
  return el;
}
function renderModuleInner(node,pv){
  if(!pv) pv=getBrowsePreview();
  const t=node.type,p=node.props||{},char=pv.char;
  const body=pv.bodies[pv.bodyIdx];
  switch(t){
    case 'title':return `<h1 style="margin:0;font-size:20px;line-height:1.3;color:var(--pink-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;">${escapeHtml(char.name||'未命名角色')}</h1>`;
    case 'avatar':{
      const src=char.avatarFile?FOLDER_AVATAR+char.avatarFile:'';
      const img=src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML='?'">`:`<span>${escapeHtml((char.name||'?').slice(0,1))}</span>`;
      return `<div style="width:100%;height:100%;border-radius:50%;background:var(--pink-light);border:3px solid var(--pink-main);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--pink-deep);font-weight:bold;">${img}</div>`;
    }
    case 'name':return `<div style="font-size:18px;font-weight:bold;color:var(--pink-deep);padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(char.name||'未命名')}</div>`;
    case 'intro':return `<div style="font-size:13px;line-height:1.5;color:var(--text);padding:8px;background:var(--pink-light);border-radius:8px;height:100%;overflow:auto;">${escapeHtml(char.intro||'（暂无介绍）')}</div>`;
    case 'tags':{
      const tags=char.tags||[];

      return `<div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px;height:100%;overflow:auto;">${tags.map(tg=>{const ttl=tg.note?` title="${escapeAttr(tg.note)}"`:'';return `<span class="char-tag"${ttl}>${escapeHtml(tg.name)}</span>`;}).join('')}</div>`;
    }
    case 'infoField':{
      const f=(data.infoFields||[]).find(x=>x.id===p.fieldId);
      if(!f) return `<div style="font-size:12px;color:#b9909c;font-style:italic;padding:4px;">（字段已删除）</div>`;
      const v=(char.info&&char.info[f.name])||'—';

      return `<div style="padding:6px 8px;background:#fff8fb;border-radius:6px;height:100%;overflow:auto;"><div style="font-size:12px;font-weight:bold;color:var(--pink-deep);margin-bottom:2px;"${ttl}>${escapeHtml(f.name)}</div><div style="font-size:13px;">${escapeHtml(v)}</div></div>`;
    }

      return `<div style="padding:8px;background:#fff8fb;border-radius:8px;height:100%;overflow:auto;"><div style="font-weight:bold;color:var(--pink-deep);font-size:13px;margin-bottom:6px;">🔖 独立字段</div>${fields.map(f=>{const v=(char.ownInfo&&char.ownInfo[f.id])||'—';return `<div style="font-size:13px;margin-bottom:4px;"><span style="color:var(--pink-deep);font-weight:bold;">${escapeHtml(f.name)}</span>：${escapeHtml(v)}</div>`;}).join('')}</div>`;
    }
    case 'ownCounter':
      return `<div style="font-size:12px;color:#a07a86;font-style:italic;padding:4px;">（只读模式不显示计数器）</div>`;
    case 'button':{
      const a=p.action||'back';
      if(a==='uidesign') return '';
      const d=BROWSE_BTN_ACTIONS[a]||BROWSE_BTN_ACTIONS.back;
      if(!d.fn) return '';
      return `<button class="btn ${d.cls}" style="width:100%;height:100%;font-size:12px;padding:4px;" onclick="${d.fn}">${escapeHtml(p.label||d.label)}</button>`;
    }
    case 'text':return `<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;height:100%;overflow:auto;padding:4px;">${escapeHtml(p.text||'')}</div>`;

    case 'dressupNavPrevBody':return renderBrowseNavInner('body','prev',pv);
    case 'dressupNavNextBody':return renderBrowseNavInner('body','next',pv);
    case 'dressupNavPrevHair':return renderBrowseNavInner('hair','prev',pv);
    case 'dressupNavNextHair':return renderBrowseNavInner('hair','next',pv);
    case 'dressupNavPrevFace':return renderBrowseNavInner('face','prev',pv);
    case 'dressupNavNextFace':return renderBrowseNavInner('face','next',pv);
    case 'dressupNavPrevClothes':return renderBrowseNavInner('clothes','prev',pv);
    case 'dressupNavNextClothes':return renderBrowseNavInner('clothes','next',pv);
    case 'dressupExtraBar':return renderBrowseExtraBarInner(pv);
  }
  return '';

function renderBrowseStageInner(pv){
  const body=pv.bodies[pv.bodyIdx];if(!body)return `<div style="color:#a07a86;text-align:center;padding:20px;">无数据</div>`;
  const hair=body.hairSets[pv.hairIdx];const face=body.faceSets[pv.faceIdx];const clothes=body.clothesSets[pv.clothesIdx];

function renderBrowseExtraBarInner(pv){

    }
    if(clothes.hasPerClothesAccessories&&(clothes.perClothesAccessories||[]).length>0){
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">专属装饰：</span>`;
      clothes.perClothesAccessories.forEach(pa=>{const active=(clothes.activePerClothesAccessoryIds||[]).includes(pa.id);innerHtml+=`<span class="acc-chip${active?' active':''}" title="${escapeAttr(pa.note||'')}" onclick="browseTogglePerAcc('${pa.id}')">${escapeHtml(pa.name)}</span>`;});
      innerHtml+=`</div>`;
    }
  }
  if(clothes){
    const tagList=(clothes.tagIds||[]).map(id=>data.clothesTags.find(t=>t.id===id)).filter(Boolean);
    if(tagList.length){
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">服装标签：</span>`;
      sortTagsByWeight(tagList).forEach(t=>{innerHtml+=`<span class="display-tag-chip" title="${escapeAttr(t.note||'')}">#${escapeHtml(t.name)}</span>`;});
      innerHtml+=`</div>`;
    }
  }
  if(hair){
    const tagList=(hair.tagIds||[]).map(id=>data.hairTags.find(t=>t.id===id)).filter(Boolean);
    if(tagList.length){
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0;"><span class="bar-label">发型标签：</span>`;
      sortTagsByWeight(tagList).forEach(t=>{innerHtml+=`<span class="display-tag-chip" title="${escapeAttr(t.note||'')}">#${escapeHtml(t.name)}</span>`;});
      innerHtml+=`</div>`;
    }
  }
  if(!innerHtml) return '';
  return `<div style="height:100%;overflow:auto;box-sizing:border-box;padding:4px;">${innerHtml}</div>`;
}

loadFromRepo();
</script>
</body>
</html>
