<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物 · 超百女友数据站</title>
<link rel="stylesheet" href="style.css">
<style>
.btn{padding:10px 18px;border:none;border-radius:10px;background:var(--pink-main);color:var(--white);font-size:15px;cursor:pointer;transition:background 0.2s}
.btn:hover{background:var(--pink-deep)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{background:var(--white);color:var(--pink-deep);border:2px solid var(--pink-main)}
.btn.ghost:hover{background:var(--pink-light)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}
.toolbar input[type="text"]{flex:1;min-width:180px;padding:10px 14px;border:2px solid var(--pink-main);border-radius:10px;font-size:15px;outline:none;background:var(--white);color:var(--text)}
.toolbar input[type="text"]:focus{border-color:var(--pink-deep)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px;margin-top:20px}
.char-card{position:relative;text-align:center;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;z-index:1}
.char-card:hover{transform:translateY(-4px);z-index:100}
.char-avatar{width:130px;height:130px;border-radius:50%;background:var(--pink-light);margin:0 auto;overflow:hidden;border:4px solid var(--pink-main);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--pink-deep);font-weight:bold;position:relative;z-index:2}
.char-avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(100%);transition:filter 0.3s;pointer-events:none}
.char-card:hover .char-avatar img{filter:grayscale(0%)}
.char-hover-info{position:absolute;left:50%;bottom:-8px;transform:translate(-50%,100%);background:rgba(90,58,69,0.96);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;width:240px;text-align:left;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:9999;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.char-hover-info .hi-name{font-size:15px;font-weight:bold;color:#ffd6e3;margin-bottom:6px}
.char-hover-info .hi-intro{color:#ffe4ec;margin-bottom:6px}
.char-hover-info .hi-tags{color:#ffd6e3;font-size:12px;line-height:1.5}
.char-card:hover .char-hover-info{opacity:1}
.grid-view,.browse-view{display:block}
.hidden{display:none !important}
.clothes-extra-bar{background:#fff8fb;border:1px dashed var(--pink-main);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clothes-extra-bar .bar-label{font-size:11px;color:var(--pink-deep);font-weight:bold}
.display-tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#fff;border:1px solid var(--pink-main);border-radius:12px;font-size:11px;color:var(--pink-deep);cursor:help;user-select:none}
.acc-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#fff;border:1px solid var(--pink-main);border-radius:12px;font-size:11px;cursor:pointer;user-select:none;transition:all 0.15s}
.acc-chip.active{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}
.variant-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#fff;border:1px solid var(--pink-main);border-radius:12px;font-size:11px;cursor:pointer;user-select:none}
.variant-chip.active{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}
.char-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 12px;background:var(--white);color:var(--pink-deep);border:2px solid var(--pink-main);border-radius:16px;font-size:13px;cursor:help}
.browse-view{padding:0;overflow-x:hidden}
.browse-canvas{position:relative;margin:0 auto}
.browse-block{position:absolute;box-sizing:border-box;overflow:hidden;font-family:inherit}
.browse-block-inner{width:100%;height:100%;box-sizing:border-box}
.loading-tip{padding:40px 20px;text-align:center;color:var(--pink-deep);font-size:14px;line-height:1.8}
.loading-tip .err{color:#c94a4a;font-weight:bold}
</style>
</head>
<body>

<nav>
<a href="index.html">首页</a>
<a href="chapters.html">章节</a>
<a href="characters.html" class="active">人物</a>
</nav>

<main>
<div id="gridView" class="grid-view">
<h1>👧 人物介绍</h1>
<div class="toolbar">
<input type="text" id="charSearch" placeholder="搜索角色名 / 介绍 / 标签">
<button class="btn ghost" onclick="clearCharSearch()">清除</button>
</div>
<div class="char-grid" id="charGrid"></div>
<div id="loadingTip" class="loading-tip">正在加载 characters-data.json…</div>
</div>

<div id="browseView" class="browse-view hidden">
  <div id="browseCanvas" class="browse-canvas"></div>
</div>
</main>

<footer>粉丝向非官方数据站 · 仅用于学习交流</footer>

<script>
/* ============ 常量 ============ */
const FOLDER_AVATAR='image/picture/';
const FOLDER_BODY='image/body/';
const FOLDER_HAIR='image/hair/';
const FOLDER_FACE='image/face/';
const FOLDER_CLOTHES='image/clothes/';
const FOLDER_ACC='image/clothes/';
const CANVAS_W_DESKTOP=1000;

const ACC_LAYERS=[
  {key:'underBackHair',label:'后发下'},
  {key:'underClothes',label:'衣服下后发上'},
  {key:'underFrontHair',label:'衣服上前发下'},
  {key:'overFrontHair',label:'前发上'}
];
const ACC_LAYER_LABEL={};
ACC_LAYERS.forEach(l=>ACC_LAYER_LABEL[l.key]=l.label);

const DEFAULT_HEIGHTS_MOBILE={
  title:50,avatar:180,name:50,intro:100,tags:80,dressupStage:500,
  dressupNavPrevChar:60,dressupNavNextChar:60,dressupNavPrevBody:60,dressupNavNextBody:60,
  dressupNavPrevHair:60,dressupNavNextHair:60,dressupNavPrevFace:60,dressupNavNextFace:60,
  dressupNavPrevClothes:60,dressupNavNextClothes:60,dressupExtraBar:200,
  infoField:70,ownInfo:160,ownCounter:140,button:40,text:60,spacer:40
};
const DEFAULT_HEIGHTS_DESKTOP={
  title:50,avatar:220,name:60,intro:100,tags:80,dressupStage:500,
  dressupNavPrevChar:96,dressupNavNextChar:96,dressupNavPrevBody:96,dressupNavNextBody:96,
  dressupNavPrevHair:96,dressupNavNextHair:96,dressupNavPrevFace:96,dressupNavNextFace:96,
  dressupNavPrevClothes:96,dressupNavNextClothes:96,dressupExtraBar:220,
  infoField:70,ownInfo:160,ownCounter:150,button:40,text:60,spacer:40
};
function getDefaultHeight(type,device){const map=device==='mobile'?DEFAULT_HEIGHTS_MOBILE:DEFAULT_HEIGHTS_DESKTOP;return map[type]||60;}

const BROWSE_BTN_ACTIONS={
  back:{label:'← 返回列表',fn:'browseGoBack()',cls:'ghost'},
  prevChar:{label:'◀ 上一个角色',fn:'browsePrevChar()',cls:'ghost'},
  nextChar:{label:'下一个角色 ▶',fn:'browseNextChar()',cls:'ghost'}
};
const KIND_LABELS={char:'角色',body:'身体',hair:'发型',face:'表情',clothes:'衣服'};

/* ============ 工具 ============ */
function genId(){return 'x'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
function genSetId(){return 's'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function detectDevice(){
  try{ if(window.matchMedia && window.matchMedia('(max-width: 768px)').matches) return 'mobile'; }catch(e){}
  if(/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent||'')) return 'mobile';
  return 'desktop';
}
function getBrowseContainerWidth(device){
  if(device==='mobile'){
    const w=window.innerWidth||375;
    return Math.max(280,w);
  }
  return CANVAS_W_DESKTOP;
}
function sortTagsByWeight(tags){
  const indexed=tags.map((t,i)=>({t,i}));
  indexed.sort((a,b)=>{
    const wa=(a.t.weight!=null&&a.t.weight!==''&&!isNaN(a.t.weight))?Number(a.t.weight):-Infinity;
    const wb=(b.t.weight!=null&&b.t.weight!==''&&!isNaN(b.t.weight))?Number(b.t.weight):-Infinity;
    if(wa!==wb) return wb-wa;
    return a.i-b.i;
  });
  return indexed.map(x=>x.t);
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escapeAttr(s){return escapeHtml(s);}

/* ============ 数据迁移/归一化 ============ */
function migrateFieldArr(a){if(!Array.isArray(a))return [];return a.map(f=>typeof f==='string'?{id:genId(),name:f,note:''}:{id:f.id||genId(),name:f.name||'',note:f.note||''});}
function migrateTags(a){
  if(!Array.isArray(a))return [];
  return a.map(t=>{
    if(typeof t==='string')return {id:genId(),name:t,note:'',weight:null};
    return {
      id:t.id||genId(),name:t.name||'',note:t.note||'',
      weight:(t.weight!=null&&t.weight!==''&&!isNaN(t.weight))?Number(t.weight):null
    };
  });
}
function migrateHair(h){return {id:h.id||genSetId(),name:h.name||'未命名发型',frontHairFile:h.frontHairFile||'',backHairFile:h.backHairFile||'',note:h.note||'',tagIds:Array.isArray(h.tagIds)?h.tagIds:[],defaultClothesId:h.defaultClothesId||'',unbound:!!h.unbound};}
function migrateFace(f){return {id:f.id||genSetId(),name:f.name||'未命名表情',imageFile:f.imageFile||'',note:f.note||''};}
function migrateGlobalAcc(a){return {id:a.id||genId(),name:a.name||'未命名装饰',note:a.note||'',imageFile:a.imageFile||'',layer:(a.layer&&ACC_LAYER_LABEL[a.layer])?a.layer:'underFrontHair',defaultOn:!!a.defaultOn};}
function migratePerAcc(pa){return {id:pa.id||genSetId(),name:pa.name||'未命名装饰',imageFile:pa.imageFile||'',note:pa.note||'',layer:(pa.layer&&ACC_LAYER_LABEL[pa.layer])?pa.layer:'underFrontHair',defaultOn:!!pa.defaultOn};}
function migrateClothes(c){
  return {
    id:c.id||genSetId(),name:c.name||'未命名衣服',imageFile:c.imageFile||'',note:c.note||'',
    tagIds:Array.isArray(c.tagIds)?c.tagIds:[],
    hasGlobalAccessories:!!c.hasGlobalAccessories,
    enabledGlobalAccessoryIds:Array.isArray(c.enabledGlobalAccessoryIds)?c.enabledGlobalAccessoryIds:[],
    activeGlobalAccessoryIds:Array.isArray(c.activeGlobalAccessoryIds)?c.activeGlobalAccessoryIds:[],
    hasPerClothesAccessories:!!c.hasPerClothesAccessories,
    perClothesAccessories:Array.isArray(c.perClothesAccessories)?c.perClothesAccessories.map(migratePerAcc):[],
    activePerClothesAccessoryIds:Array.isArray(c.activePerClothesAccessoryIds)?c.activePerClothesAccessoryIds:[],
    hasVariants:!!c.hasVariants,
    variants:Array.isArray(c.variants)?c.variants:[],
    activeVariantIndex:c.activeVariantIndex||0,
    hideBackHair:!!c.hideBackHair,hideHead:!!c.hideHead,hideTorso:!!c.hideTorso,hideHand:!!c.hideHand,hideFoot:!!c.hideFoot
  };
}
function migrateBody(b){
  return {
    id:b.id||genSetId(),name:b.name||'默认',file:b.file||'',
    headFile:b.headFile||'',torsoFile:b.torsoFile||'',handFile:b.handFile||'',footFile:b.footFile||'',
    note:b.note||'',
    hairSets:Array.isArray(b.hairSets)?b.hairSets.map(migrateHair):[],
    faceSets:Array.isArray(b.faceSets)?b.faceSets.map(migrateFace):[],
    clothesSets:Array.isArray(b.clothesSets)?b.clothesSets.map(migrateClothes):[]
  };
}
function normalizeCharacter(c){
  const nc={
    id:c.id||genId(),name:c.name||'',intro:c.intro||'',avatarFile:c.avatarFile||'',
    tags:migrateTags(c.tags),bodies:[],
    globalAccessories:Array.isArray(c.globalAccessories)?c.globalAccessories.map(migrateGlobalAcc):[],
    ownInfoFields:migrateFieldArr(c.ownInfoFields),
    ownInfo:Object.assign({},c.ownInfo||{}),
    customCounters:migrateFieldArr(c.customCounters),
    info:c.info||{},
    uiLayoutDesktop:migrateUILayout(c.uiLayoutDesktop||c.uiLayout),
    uiLayoutMobile:migrateUILayout(c.uiLayoutMobile)
  };
  delete nc.dims;delete nc.uiLayout;delete nc.hairTags;
  if(Array.isArray(c.bodies)&&c.bodies.length>0){
    nc.bodies=c.bodies.map(migrateBody);
  }else{
    const b=migrateBody({name:'默认',file:c.body?.file||'',note:c.body?.note||''});
    b.hairSets=Array.isArray(c.hairSets)?c.hairSets.map(migrateHair):[];
    b.faceSets=Array.isArray(c.faceSets)?c.faceSets.map(migrateFace):[];
    b.clothesSets=Array.isArray(c.clothesSets)?c.clothesSets.map(migrateClothes):[];
    nc.bodies=[b];
  }
  return nc;
}

function normalizeDataFromJSON(d){
  const r={
    characters:(d.characters||[]).map(normalizeCharacter),
    infoFields:migrateFieldArr(d.infoFields),
    customCounters:migrateFieldArr(d.customCounters),
    clothesTags:migrateTags(d.clothesTags),
    hairTags:migrateTags(d.hairTags),
    globalAccessories:Array.isArray(d.globalAccessories)?d.globalAccessories.map(migrateGlobalAcc):[],
    globalUILayoutDesktop:migrateUILayout(d.globalUILayoutDesktop||d.globalUILayout),
    globalUILayoutMobile:migrateUILayout(d.globalUILayoutMobile)
  };
  // 迁移旧版 character.hairTags 到全局
  if(r.hairTags.length===0){
    const allOld=[];
    (d.characters||[]).forEach(c=>{
      if(Array.isArray(c.hairTags)){
        c.hairTags.forEach(t=>{
          const tag=migrateTags([t])[0];
          if(!allOld.some(x=>x.name===tag.name)) allOld.push(tag);
        });
      }
    });
    r.hairTags=allOld;
  }
  return r;
}

/* ============ 布局 ============ */
function computeModuleRect(mod, containerWidth){
  let w;
  if(mod.widthMode==='fixed'){
    w=Math.max(20,mod.widthFixed||200);
  }else{
    const pct=Math.max(1,Math.min(100,mod.widthPercent||100));
    w=Math.max(20,Math.floor(containerWidth*pct/100));
  }
  w=Math.min(w,containerWidth);

  const ox=mod.offsetX||0;
  let x=0;
  if(mod.alignX==='left') x=ox;
  else if(mod.alignX==='right') x=containerWidth-w-ox;
  else if(mod.alignX==='center') x=Math.floor((containerWidth-w)/2)+ox;
  else x=ox;

  return {x,y:Math.max(0,mod.y||0),w,h:Math.max(10,mod.height||60)};
}

function computeTotalHeight(modules,containerWidth){
  let maxB=0;
  modules.forEach(m=>{
    const r=computeModuleRect(m,containerWidth);
    maxB=Math.max(maxB,r.y+r.h);
  });
  return maxB;
}

function migrateUILayout(l){
  if(!l||!Array.isArray(l.modules))return null;
  const hasNew=l.modules.some(m=>m&&(m.type==='dressupStage'||(m.type&&m.type.startsWith('dressupNav'))||m.type==='dressupExtraBar'));
  if(!hasNew)return null;
  return {version:5,modules:l.modules.filter(m=>m&&m.type).map(m=>{
    if(m.alignX!==undefined){
      return {
        id:m.id||genId(),type:m.type,
        alignX:(['left','right','center','free'].includes(m.alignX))?m.alignX:'left',
        offsetX:+m.offsetX||0,
        y:Math.max(0,+m.y||0),
        widthMode:m.widthMode==='fixed'?'fixed':'percent',
        widthPercent:Math.max(1,Math.min(100,+m.widthPercent||100)),
        widthFixed:Math.max(20,+m.widthFixed||200),
        height:Math.max(10,+m.height||getDefaultHeight(m.type,'desktop')),
        zIndex:+m.zIndex||1,
        props:Object.assign({},m.props||{})
      };
    }else{
      return {
        id:m.id||genId(),type:m.type,
        alignX:'free',
        offsetX:+m.x||0,
        y:Math.max(0,+m.y||0),
        widthMode:'fixed',
        widthPercent:100,
        widthFixed:Math.max(20,+m.w||200),
        height:Math.max(10,+m.h||getDefaultHeight(m.type,'desktop')),
        zIndex:+m.zIndex||1,
        props:Object.assign({},m.props||{})
      };
    }
  })};
}

function buildMobileDefaultLayout(){
  const mods=[];
  let curY=8;
  const push=(type,opts)=>{
    opts=opts||{};
    const h=opts.height!==undefined?opts.height:getDefaultHeight(type,'mobile');
    const y=(opts.y!==undefined)?opts.y:curY;
    mods.push({
      id:genId(),type,
      alignX:opts.alignX||'left',
      offsetX:opts.offsetX!==undefined?opts.offsetX:8,
      y:y,
      widthMode:opts.widthMode||'percent',
      widthPercent:opts.widthPercent!==undefined?opts.widthPercent:100,
      widthFixed:opts.widthFixed||200,
      height:h,
      zIndex:opts.zIndex||1,
      props:opts.props||{}
    });
    if(opts.y===undefined) curY=y+h+6;
  };
  push('title',{height:44});
  push('button',{alignX:'left',offsetX:8,widthPercent:30,height:38,y:curY,props:{action:'back'}});
  push('button',{alignX:'center',offsetX:0,widthPercent:30,height:38,y:curY,props:{action:'prevChar'}});
  push('button',{alignX:'right',offsetX:8,widthPercent:30,height:38,y:curY,props:{action:'nextChar'}});
  curY+=38+6;
  push('avatar',{alignX:'center',offsetX:0,widthMode:'fixed',widthFixed:140,height:140});
  push('name',{height:44});
  push('intro',{height:90});
  push('tags',{height:70});
  push('dressupStage',{alignX:'center',offsetX:0,widthPercent:96,height:460});
  const navKinds=['Char','Body','Hair','Face','Clothes'];
  navKinds.forEach(k=>{
    push('dressupNavPrev'+k,{alignX:'left',offsetX:8,widthPercent:46,height:56,y:curY});
    push('dressupNavNext'+k,{alignX:'right',offsetX:8,widthPercent:46,height:56,y:curY});
    curY+=56+4;
  });
  curY+=4;
  push('dressupExtraBar',{height:180});
  const fields=(typeof data!=='undefined'&&data.infoFields)||[];
  fields.forEach(f=>{push('infoField',{height:70,props:{fieldId:f.id}});});
  push('ownInfo',{height:150});
  push('ownCounter',{height:140});
  return {version:5,modules:mods};
}

function buildDesktopDefaultLayout(){
  const mods=[];
  const push=(type,opts)=>{
    opts=opts||{};
    mods.push({
      id:genId(),type,
      alignX:opts.alignX||'left',
      offsetX:opts.offsetX!==undefined?opts.offsetX:20,
      y:opts.y!==undefined?opts.y:0,
      widthMode:opts.widthMode||'percent',
      widthPercent:opts.widthPercent!==undefined?opts.widthPercent:100,
      widthFixed:opts.widthFixed||200,
      height:opts.height!==undefined?opts.height:getDefaultHeight(type,'desktop'),
      zIndex:opts.zIndex||1,
      props:opts.props||{}
    });
  };
  push('title',{y:20,widthPercent:40});
  push('button',{alignX:'right',offsetX:20+120+8,widthMode:'fixed',widthFixed:150,y:24,height:40,props:{action:'nextChar'}});
  push('button',{alignX:'right',offsetX:20,widthMode:'fixed',widthFixed:120,y:24,height:40,props:{action:'back'}});
  push('avatar',{y:90,widthMode:'fixed',widthFixed:220,height:220});
  push('name',{y:90,offsetX:260,widthPercent:72});
  push('intro',{y:160,offsetX:260,widthPercent:72});
  push('tags',{y:260,offsetX:260,widthPercent:72});
  push('dressupStage',{y:350,alignX:'center',offsetX:0,widthPercent:76,height:500});
  const navKinds=['Char','Body','Hair','Face','Clothes'];
  let ny=350;
  navKinds.forEach(k=>{
    push('dressupNavPrev'+k,{y:ny,offsetX:20,widthMode:'fixed',widthFixed:90,height:96});
    ny+=100;
  });
  ny=350;
  navKinds.forEach(k=>{
    push('dressupNavNext'+k,{y:ny,alignX:'right',offsetX:20,widthMode:'fixed',widthFixed:90,height:96});
    ny+=100;
  });
  push('dressupExtraBar',{y:860,alignX:'center',offsetX:0,widthPercent:96,height:220});
  let yy=1100;
  const fields=(typeof data!=='undefined'&&data.infoFields)||[];
  fields.forEach((f,i)=>{
    push('infoField',{y:yy+Math.floor(i/2)*70,alignX:(i%2===0)?'left':'right',offsetX:20,widthPercent:47,height:60,props:{fieldId:f.id}});
  });
  yy+=Math.ceil(fields.length/2)*70+20;
  push('ownInfo',{y:yy,offsetX:20,widthPercent:96,height:160}); yy+=170;
  push('ownCounter',{y:yy,offsetX:20,widthPercent:96,height:150});
  return {version:5,modules:mods};
}

function buildDefaultLayoutForDevice(device){return device==='mobile'?buildMobileDefaultLayout():buildDesktopDefaultLayout();}

function syncLayoutWithInfoFields(layout){
  if(!layout)return layout;
  const have=new Set(layout.modules.filter(m=>m.type==='infoField').map(m=>m.props&&m.props.fieldId));
  const miss=((typeof data!=='undefined'&&data.infoFields)||[]).filter(f=>!have.has(f.id));
  if(miss.length===0)return layout;
  let maxY=0;
  layout.modules.forEach(m=>{maxY=Math.max(maxY,(m.y||0)+(m.height||60));});
  maxY+=6;
  miss.forEach((f,i)=>{
    layout.modules.push({
      id:genId(),type:'infoField',
      alignX:'left',offsetX:8,y:maxY+i*76,
      widthMode:'percent',widthPercent:100,widthFixed:200,
      height:70,zIndex:1,
      props:{fieldId:f.id}
    });
  });
  return layout;
}

function getEffectiveLayout(char, device){
  device=device||detectDevice();
  const charLayout=device==='mobile'?char?.uiLayoutMobile:char?.uiLayoutDesktop;
  const globalLayout=device==='mobile'?data.globalUILayoutMobile:data.globalUILayoutDesktop;
  let layout=migrateUILayout(charLayout)||migrateUILayout(globalLayout);
  if(!layout)layout=buildDefaultLayoutForDevice(device);
  layout=JSON.parse(JSON.stringify(layout));
  return syncLayoutWithInfoFields(layout);
}

/* ============ 数据加载 ============ */
let data={
  characters:[],infoFields:[],customCounters:[],clothesTags:[],hairTags:[],
  globalAccessories:[],globalUILayoutDesktop:null,globalUILayoutMobile:null
};

async function loadCharactersData(){
  const resp=await fetch('characters-data.json',{cache:'no-store'});
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const d=await resp.json();
  data=normalizeDataFromJSON(d);
  return data;
}

/* ============ 视图切换 ============ */
let currentView='grid';
function showView(view){
  currentView=view;
  document.getElementById('gridView').classList.toggle('hidden',view!=='grid');
  document.getElementById('browseView').classList.toggle('hidden',view!=='browse');
}

/* ============ 角色卡片列表 ============ */
let charSearchTerm='';
function renderCharGrid(){
  const grid=document.getElementById('charGrid');
  grid.innerHTML='';
  const tip=document.getElementById('loadingTip');
  if(!data.characters||data.characters.length===0){
    if(tip) tip.style.display='block';
    return;
  }
  if(tip) tip.style.display='none';

  const term=(charSearchTerm||'').trim();
  const filtered=data.characters.filter(c=>{
    if(!term)return true;
    if(c.name&&c.name.includes(term))return true;
    if(c.intro&&c.intro.includes(term))return true;
    if(Array.isArray(c.tags)&&c.tags.some(t=>t.name.includes(term)))return true;
    return false;
  });

  if(filtered.length===0){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#a07a86;font-size:14px;">没有匹配的角色</div>';
    return;
  }

  filtered.forEach(c=>{
    const card=document.createElement('div');
    card.className='char-card';
    card.dataset.charId=c.id;
    const src=c.avatarFile?FOLDER_AVATAR+c.avatarFile:'';
    const ah=src?`<img src="${src}" onerror="this.style.display='none';this.parentNode.innerHTML='<span>?</span>'">`:`<span>${escapeHtml((c.name||'?').slice(0,1))}</span>`;
    const tagsLine=(c.tags&&c.tags.length)?`<div class="hi-tags">${c.tags.map(t=>{const ttl=t.note?` title="${escapeAttr(t.note)}"`:'';return `<span class="tag-hover"${ttl}>#${escapeHtml(t.name)}</span>`;}).join(' ')}</div>`:'';
    card.innerHTML=`<div class="char-avatar">${ah}</div><div class="char-hover-info"><div class="hi-name">${escapeHtml(c.name||'未命名')}</div><div class="hi-intro">${escapeHtml(c.intro||'（暂无介绍）')}</div>${tagsLine}</div>`;
    card.addEventListener('click',()=>openBrowsePage(c.id));
    grid.appendChild(card);
  });
}
function clearCharSearch(){document.getElementById('charSearch').value='';charSearchTerm='';renderCharGrid();}
document.getElementById('charSearch').addEventListener('input',e=>{
  charSearchTerm=e.target.value;
  renderCharGrid();
});

/* ============ 浏览页 ============ */
let browseChar=null;
let browseBodies=[],browseBodyIdx=0,browseHairIdx=0,browseFaceIdx=0,browseClothesIdx=0;

function cloneForBrowse(bodies){
  return (bodies||[]).map(b=>({
    id:b.id,name:b.name||'',file:b.file||'',
    headFile:b.headFile||'',torsoFile:b.torsoFile||'',handFile:b.handFile||'',footFile:b.footFile||'',
    note:b.note||'',
    hairSets:(b.hairSets||[]).map(h=>({...h,tagIds:[...(h.tagIds||[])]})),
    faceSets:(b.faceSets||[]).map(f=>({...f})),
    clothesSets:(b.clothesSets||[]).map(c=>({
      ...c,
      tagIds:[...(c.tagIds||[])],
      enabledGlobalAccessoryIds:[...(c.enabledGlobalAccessoryIds||[])],
      activeGlobalAccessoryIds:[...(c.activeGlobalAccessoryIds||[])],
      perClothesAccessories:(c.perClothesAccessories||[]).map(p=>({...p})),
      activePerClothesAccessoryIds:[...(c.activePerClothesAccessoryIds||[])],
      variants:(c.variants||[]).map(v=>({...v}))
    }))
  }));
}

function syncDefaultAccessories(clothes,charAccs){
  if(!clothes) return;
  if(clothes.hasGlobalAccessories){
    const enabled=clothes.enabledGlobalAccessoryIds||[];
    const active=new Set(clothes.activeGlobalAccessoryIds||[]);
    enabled.forEach(gid=>{const g=(charAccs||[]).find(x=>x.id===gid);if(g&&g.defaultOn) active.add(gid);});
    clothes.activeGlobalAccessoryIds=Array.from(active);
  }
  if(clothes.hasPerClothesAccessories){
    const active=new Set(clothes.activePerClothesAccessoryIds||[]);
    (clothes.perClothesAccessories||[]).forEach(pa=>{if(pa.defaultOn) active.add(pa.id);});
    clothes.activePerClothesAccessoryIds=Array.from(active);
  }
}

function openBrowsePage(charId){
  const c=data.characters.find(x=>x.id===charId);
  if(!c)return;
  browseChar=c;
  browseBodies=cloneForBrowse(c.bodies||[]);
  const accs=c.globalAccessories||[];
  browseBodies.forEach(b=>b.clothesSets.forEach(cl=>syncDefaultAccessories(cl,accs)));
  browseBodyIdx=0;browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;
  showView('browse');
  renderBrowseCanvas();
  window.scrollTo({top:0,behavior:'smooth'});
}

function browseGoBack(){
  browseChar=null;
  browseBodies=[];
  showView('grid');
}

function browsePrevChar(){
  if(!browseChar)return;
  const idx=data.characters.findIndex(c=>c.id===browseChar.id);
  if(idx===-1)return;
  const prev=data.characters[(idx-1+data.characters.length)%data.characters.length];
  if(prev){
    browseChar=prev;
    browseBodies=cloneForBrowse(prev.bodies||[]);
    const accs=prev.globalAccessories||[];
    browseBodies.forEach(b=>b.clothesSets.forEach(cl=>syncDefaultAccessories(cl,accs)));
    browseBodyIdx=0;browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;
    renderBrowseCanvas();
  }
}
function browseNextChar(){
  if(!browseChar)return;
  const idx=data.characters.findIndex(c=>c.id===browseChar.id);
  if(idx===-1)return;
  const next=data.characters[(idx+1)%data.characters.length];
  if(next){
    browseChar=next;
    browseBodies=cloneForBrowse(next.bodies||[]);
    const accs=next.globalAccessories||[];
    browseBodies.forEach(b=>b.clothesSets.forEach(cl=>syncDefaultAccessories(cl,accs)));
    browseBodyIdx=0;browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;
    renderBrowseCanvas();
  }
}

function browseNavClick(kind,dir){
  if(!browseChar)return;
  if(kind==='char'){if(dir==='prev')browsePrevChar();else browseNextChar();return;}
  const body=browseBodies[browseBodyIdx];
  if(!body)return;
  if(kind==='body'){
    browseBodyIdx=dir==='prev'?(browseBodyIdx-1+browseBodies.length)%browseBodies.length:(browseBodyIdx+1)%browseBodies.length;
    browseHairIdx=0;browseFaceIdx=0;browseClothesIdx=0;
  }else if(kind==='hair'){
    const len=body.hairSets.length;
    if(len>0)browseHairIdx=dir==='prev'?(browseHairIdx-1+len)%len:(browseHairIdx+1)%len;
  }else if(kind==='face'){
    const len=body.faceSets.length;
    if(len>0)browseFaceIdx=dir==='prev'?(browseFaceIdx-1+len)%len:(browseFaceIdx+1)%len;
  }else if(kind==='clothes'){
    const len=body.clothesSets.length;
    if(len>0)browseClothesIdx=dir==='prev'?(browseClothesIdx-1+len)%len:(browseClothesIdx+1)%len;
  }
  const y=window.scrollY;
  renderBrowseCanvas();
  window.scrollTo(0,y);
}

function browseSetVariant(i){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;c.activeVariantIndex=i;const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseToggleGlobalAcc(gid){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;if(!c.activeGlobalAccessoryIds)c.activeGlobalAccessoryIds=[];const k=c.activeGlobalAccessoryIds.indexOf(gid);if(k===-1)c.activeGlobalAccessoryIds.push(gid);else c.activeGlobalAccessoryIds.splice(k,1);const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}
function browseTogglePerAcc(paId){const c=browseBodies[browseBodyIdx]?.clothesSets[browseClothesIdx];if(!c)return;if(!c.activePerClothesAccessoryIds)c.activePerClothesAccessoryIds=[];const k=c.activePerClothesAccessoryIds.indexOf(paId);if(k===-1)c.activePerClothesAccessoryIds.push(paId);else c.activePerClothesAccessoryIds.splice(k,1);const y=window.scrollY;renderBrowseCanvas();window.scrollTo(0,y);}

function getCharCounterTotal(cid,charId){return 0;} // 只读版本不再统计出场计数器，保留空函数供 ownCounter 模块使用

function renderBrowseCanvas(){
  const canvas=document.getElementById('browseCanvas');
  if(!canvas||!browseChar)return;
  const device=detectDevice();
  const containerWidth=getBrowseContainerWidth(device);
  const layout=getEffectiveLayout(browseChar, device);
  canvas.innerHTML='';
  layout.modules.forEach(mod=>{
    const r=computeModuleRect(mod, containerWidth);
    const el=document.createElement('div');
    el.className='browse-block';
    el.dataset.modType=mod.type;
    el.dataset.modId=mod.id;
    el.style.left=r.x+'px';
    el.style.top=r.y+'px';
    el.style.width=r.w+'px';
    el.style.height=r.h+'px';
    el.style.zIndex=mod.zIndex||1;
    const inner=document.createElement('div');
    inner.className='browse-block-inner';
    inner.innerHTML=renderBrowseModuleInner(mod);
    el.appendChild(inner);
    canvas.appendChild(el);
  });
  const totalH=computeTotalHeight(layout.modules, containerWidth);
  canvas.style.width=containerWidth+'px';
  canvas.style.height=Math.max(400,totalH+20)+'px';
}

function renderBrowseModuleInner(mod){
  switch(mod.type){
    case 'title':return `<h1 style="margin:0;font-size:22px;line-height:1.3;color:var(--pink-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;box-sizing:border-box;">${escapeHtml(browseChar.name||'未命名角色')}</h1>`;
    case 'avatar':{
      const src=browseChar.avatarFile?FOLDER_AVATAR+browseChar.avatarFile:'';
      const img=src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML='?'">`:`<span>${escapeHtml((browseChar.name||'?').slice(0,1))}</span>`;
      return `<div style="width:100%;height:100%;border-radius:50%;background:var(--pink-light);border:3px solid var(--pink-main);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--pink-deep);font-weight:bold;">${img}</div>`;
    }
    case 'name':return `<div style="font-size:20px;font-weight:bold;color:var(--pink-deep);padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(browseChar.name||'未命名')}</div>`;
    case 'intro':return `<div style="font-size:13px;line-height:1.5;color:var(--text);padding:8px;background:var(--pink-light);border-radius:8px;height:100%;overflow:auto;box-sizing:border-box;">${escapeHtml(browseChar.intro||'（暂无介绍）')}</div>`;
    case 'tags':{
      const tags=browseChar.tags||[];
      if(tags.length===0)return `<div style="color:#a07a86;font-style:italic;font-size:12px;padding:4px;">暂无标签</div>`;
      return `<div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px;height:100%;overflow:auto;box-sizing:border-box;">${tags.map(t=>{const ttl=t.note?` title="${escapeAttr(t.note)}"`:'';return `<span class="char-tag"${ttl} style="cursor:help;font-size:12px;">${escapeHtml(t.name)}</span>`;}).join('')}</div>`;
    }
    case 'infoField':{
      const f=(data.infoFields||[]).find(x=>x.id===mod.props.fieldId);
      if(!f)return `<div style="font-size:12px;color:#b9909c;font-style:italic;padding:4px;">（字段已删除）</div>`;
      const v=(browseChar.info&&browseChar.info[f.name])||'—';
      const ttl=f.note?` title="${escapeAttr(f.note)}"`:'';
      return `<div style="padding:6px 8px;background:#fff8fb;border-radius:6px;height:100%;box-sizing:border-box;overflow:auto;"><div style="font-size:12px;font-weight:bold;color:var(--pink-deep);margin-bottom:2px;"${ttl}>${escapeHtml(f.name)}</div><div style="font-size:13px;color:var(--text);">${escapeHtml(v)}</div></div>`;
    }
    case 'ownInfo':{
      const fields=browseChar.ownInfoFields||[];
      if(fields.length===0)return `<div style="font-size:12px;color:#a07a86;font-style:italic;padding:4px;">（无独立字段）</div>`;
      return `<div style="padding:8px;background:#fff8fb;border-radius:8px;height:100%;box-sizing:border-box;overflow:auto;"><div style="font-weight:bold;color:var(--pink-deep);font-size:13px;margin-bottom:6px;">🔖 独立字段</div>${fields.map(f=>{const v=(browseChar.ownInfo&&browseChar.ownInfo[f.id])||'—';return `<div style="font-size:13px;margin-bottom:4px;"><span style="color:var(--pink-deep);font-weight:bold;">${escapeHtml(f.name)}</span>：${escapeHtml(v)}</div>`;}).join('')}</div>`;
    }
    case 'ownCounter':{
      const counters=browseChar.customCounters||[];
      if(counters.length===0)return `<div style="font-size:12px;color:#a07a86;font-style:italic;padding:4px;">（无独立计数器）</div>`;
      return `<div style="padding:8px;background:#fff8fb;border-radius:8px;height:100%;box-sizing:border-box;overflow:auto;"><div style="font-weight:bold;color:var(--pink-deep);font-size:13px;margin-bottom:6px;">🔢 独立计数器</div>${counters.map(c=>{const v=getCharCounterTotal(c.id,browseChar.id);return `<div style="font-size:13px;margin-bottom:4px;"><span style="color:var(--pink-deep);font-weight:bold;">${escapeHtml(c.name)}</span>：<span style="color:#3355aa;font-weight:bold;">${v}</span></div>`;}).join('')}</div>`;
    }
    case 'button':{
      const a=mod.props.action||'back';
      const d=BROWSE_BTN_ACTIONS[a]||BROWSE_BTN_ACTIONS.back;
      return `<button class="btn ${d.cls}" style="width:100%;height:100%;font-size:12px;padding:4px;" onclick="${d.fn}">${escapeHtml(mod.props.label||d.label)}</button>`;
    }
    case 'text':return `<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text);height:100%;overflow:auto;padding:4px;box-sizing:border-box;">${escapeHtml(mod.props.text||'')}</div>`;
    case 'spacer':return '';
    case 'dressupStage':return renderBrowseStageInner();
    case 'dressupNavPrevChar':return renderBrowseNavInner('char','prev');
    case 'dressupNavNextChar':return renderBrowseNavInner('char','next');
    case 'dressupNavPrevBody':return renderBrowseNavInner('body','prev');
    case 'dressupNavNextBody':return renderBrowseNavInner('body','next');
    case 'dressupNavPrevHair':return renderBrowseNavInner('hair','prev');
    case 'dressupNavNextHair':return renderBrowseNavInner('hair','next');
    case 'dressupNavPrevFace':return renderBrowseNavInner('face','prev');
    case 'dressupNavNextFace':return renderBrowseNavInner('face','next');
    case 'dressupNavPrevClothes':return renderBrowseNavInner('clothes','prev');
    case 'dressupNavNextClothes':return renderBrowseNavInner('clothes','next');
    case 'dressupExtraBar':return renderBrowseExtraBarInner();
  }
  return '';
}

function renderBrowseStageInner(){
  const body=browseBodies[browseBodyIdx];
  if(!body)return `<div style="color:#a07a86;text-align:center;padding:20px;">无数据</div>`;
  const hair=body.hairSets[browseHairIdx];
  const face=body.faceSets[browseFaceIdx];
  const clothes=body.clothesSets[browseClothesIdx];
  const tmp=document.createElement('div');
  tmp.style.cssText='position:relative;width:100%;height:100%;background:var(--pink-light);border-radius:12px;overflow:hidden;';
  renderDressupLayers(tmp,{
    body,hair,face,clothes,
    charAccs:browseChar.globalAccessories||[],
    enabledGlobalAccIds:clothes?.enabledGlobalAccessoryIds||[],
    activeGlobalAccIds:clothes?.activeGlobalAccessoryIds||[],
    activePerAccIds:clothes?.activePerClothesAccessoryIds||[]
  });
  return tmp.outerHTML;
}

function renderBrowseNavInner(kind,dir){
  const label=KIND_LABELS[kind]||kind;
  let name='—';
  if(kind==='char'){
    if(browseChar){
      const idx=data.characters.findIndex(c=>c.id===browseChar.id);
      if(idx!==-1){
        if(dir==='prev')name=data.characters[(idx-1+data.characters.length)%data.characters.length]?.name||'—';
        else name=data.characters[(idx+1)%data.characters.length]?.name||'—';
      }
    }
  }else{
    const body=browseBodies[browseBodyIdx];
    if(body){
      if(kind==='body')name=body.name||'—';
      else if(kind==='hair')name=body.hairSets[browseHairIdx]?.name||'—';
      else if(kind==='face')name=body.faceSets[browseFaceIdx]?.name||'—';
      else if(kind==='clothes')name=body.clothesSets[browseClothesIdx]?.name||'—';
    }
  }
  const arrow=dir==='prev'?'◀':'▶';
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.9);border-radius:10px;box-shadow:0 2px 6px rgba(255,92,138,0.25);cursor:pointer;padding:4px;box-sizing:border-box;" onclick="browseNavClick('${kind}','${dir}')">
    <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-main);background:var(--white);color:var(--pink-deep);display:flex;align-items:center;justify-content:center;font-size:10px;">${arrow}</div>
    <div style="font-size:9px;color:#a07a86;font-weight:bold;margin-top:2px;">${label}</div>
    <div style="font-size:10px;color:var(--pink-deep);font-weight:bold;text-align:center;word-break:break-all;margin-top:2px;line-height:1.2;">${escapeHtml(name)}</div>
  </div>`;
}

function renderBrowseExtraBarInner(){
  const body=browseBodies[browseBodyIdx];
  if(!body)return '';
  const clothes=body.clothesSets[browseClothesIdx];
  const hair=body.hairSets[browseHairIdx];
  const charAccs=browseChar.globalAccessories||[];
  let innerHtml='';
  if(clothes&&clothes.hasVariants&&clothes.variants.length>0){
    innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">状态：</span>`;
    clothes.variants.forEach((v,i)=>{
      const active=(clothes.activeVariantIndex||0)===i;
      innerHtml+=`<span class="variant-chip${active?' active':''}" onclick="browseSetVariant(${i})">${i+1}.${escapeHtml(v.name||'默认')}</span>`;
    });
    innerHtml+=`</div>`;
  }
  if(clothes&&(clothes.hasGlobalAccessories||clothes.hasPerClothesAccessories)){
    if(clothes.hasGlobalAccessories&&clothes.enabledGlobalAccessoryIds.length>0){
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">角色装饰：</span>`;
      clothes.enabledGlobalAccessoryIds.forEach(gid=>{
        const g=charAccs.find(x=>x.id===gid);
        if(!g)return;
        const active=(clothes.activeGlobalAccessoryIds||[]).includes(gid);
        innerHtml+=`<span class="acc-chip${active?' active':''}" title="${escapeAttr(g.note||'')} · 层：${ACC_LAYER_LABEL[g.layer]||''}${g.defaultOn?' · 默认':''}" onclick="browseToggleGlobalAcc('${gid}')">${escapeHtml(g.name)}</span>`;
      });
      innerHtml+=`</div>`;
    }
    if(clothes.hasPerClothesAccessories&&clothes.perClothesAccessories.length>0){
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">专属装饰：</span>`;
      clothes.perClothesAccessories.forEach(pa=>{
        const active=(clothes.activePerClothesAccessoryIds||[]).includes(pa.id);
        innerHtml+=`<span class="acc-chip${active?' active':''}" title="${escapeAttr(pa.note||'')} · 层：${ACC_LAYER_LABEL[pa.layer]||''}${pa.defaultOn?' · 默认':''}" onclick="browseTogglePerAcc('${pa.id}')">${escapeHtml(pa.name)}</span>`;
      });
      innerHtml+=`</div>`;
    }
  }
  if(clothes){
    const tagList=(clothes.tagIds||[]).map(id=>data.clothesTags.find(t=>t.id===id)).filter(Boolean);
    if(tagList.length>0){
      const sorted=sortTagsByWeight(tagList);
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0 0 4px;"><span class="bar-label">服装标签：</span>`;
      sorted.forEach(t=>{
        const titleParts=[];
        if(t.note)titleParts.push(t.note);
        if(t.weight!=null)titleParts.push('权重 '+t.weight);
        innerHtml+=`<span class="display-tag-chip" title="${escapeAttr(titleParts.join(' · '))}">#${escapeHtml(t.name)}</span>`;
      });
      innerHtml+=`</div>`;
    }
  }
  if(hair){
    const tagList=(hair.tagIds||[]).map(id=>data.hairTags.find(t=>t.id===id)).filter(Boolean);
    if(tagList.length>0){
      const sorted=sortTagsByWeight(tagList);
      innerHtml+=`<div class="clothes-extra-bar" style="margin:0;"><span class="bar-label">发型标签：</span>`;
      sorted.forEach(t=>{
        const titleParts=[];
        if(t.note)titleParts.push(t.note);
        if(t.weight!=null)titleParts.push('权重 '+t.weight);
        innerHtml+=`<span class="display-tag-chip" title="${escapeAttr(titleParts.join(' · '))}">#${escapeHtml(t.name)}</span>`;
      });
      innerHtml+=`</div>`;
    }
  }
  if(!innerHtml) return '';
  return `<div style="height:100%;overflow:auto;box-sizing:border-box;padding:4px;">${innerHtml}</div>`;
}

/* ============ 换装分层渲染 ============ */
function renderDressupLayers(stage, ctx){
  stage.innerHTML='';
  const {body,hair,face,clothes,charAccs,enabledGlobalAccIds,activeGlobalAccIds,activePerAccIds}=ctx;
  const hideBackHair=!!(clothes&&clothes.hideBackHair);
  const hideHead=!!(clothes&&clothes.hideHead);
  const hideTorso=!!(clothes&&clothes.hideTorso);
  const hideHand=!!(clothes&&clothes.hideHand);
  const hideFoot=!!(clothes&&clothes.hideFoot);

  const accByLayer={underBackHair:[],underClothes:[],underFrontHair:[],overFrontHair:[]};
  if(clothes&&clothes.hasPerClothesAccessories){
    (clothes.perClothesAccessories||[]).forEach(pa=>{
      if((activePerAccIds||[]).includes(pa.id)&&pa.imageFile){
        const layer=accByLayer[pa.layer]?pa.layer:'underFrontHair';
        accByLayer[layer].push(FOLDER_ACC+pa.imageFile);
      }
    });
  }
  if(clothes&&clothes.hasGlobalAccessories){
    (charAccs||[]).forEach(g=>{
      const enabled=(enabledGlobalAccIds||[]).includes(g.id);
      const active=(activeGlobalAccIds||[]).includes(g.id);
      if(enabled&&active&&g.imageFile){
        const layer=accByLayer[g.layer]?g.layer:'underFrontHair';
        accByLayer[layer].push(FOLDER_ACC+g.imageFile);
      }
    });
  }

  const addImg=(src)=>{
    if(!src)return;
    const div=document.createElement('div');
    div.className='dressup-layer';
    div.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;';
    const img=document.createElement('img');
    img.src=src;
    img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;';
    img.onerror=()=>{img.style.display='none';};
    div.appendChild(img);
    stage.appendChild(div);
  };

  accByLayer.underBackHair.forEach(src=>addImg(src));
  if(!hideBackHair&&hair?.backHairFile)addImg(FOLDER_HAIR+hair.backHairFile);
  accByLayer.underClothes.forEach(src=>addImg(src));

  if(body){
    const hasParts=body.headFile||body.torsoFile||body.handFile||body.footFile;
    if(!hasParts&&body.file){
      addImg(FOLDER_BODY+body.file);
    }else{
      /* 躯体最低，其他覆盖其上 */
      if(!hideTorso&&body.torsoFile)addImg(FOLDER_BODY+body.torsoFile);
      if(!hideFoot&&body.footFile)addImg(FOLDER_BODY+body.footFile);
      if(!hideHand&&body.handFile)addImg(FOLDER_BODY+body.handFile);
      if(!hideHead&&body.headFile)addImg(FOLDER_BODY+body.headFile);
    }
  }

  if(face?.imageFile)addImg(FOLDER_FACE+face.imageFile);
  if(clothes?.imageFile)addImg(FOLDER_CLOTHES+clothes.imageFile);
  if(clothes&&clothes.hasVariants&&clothes.variants.length>0){
    const v=clothes.variants[clothes.activeVariantIndex||0];
    if(v&&v.imageFile)addImg(FOLDER_CLOTHES+v.imageFile);
  }
  accByLayer.underFrontHair.forEach(src=>addImg(src));
  if(hair?.frontHairFile)addImg(FOLDER_HAIR+hair.frontHairFile);
  accByLayer.overFrontHair.forEach(src=>addImg(src));

  if(stage.children.length===0){
    const hint=document.createElement('div');
    hint.className='dressup-layer';
    hint.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--pink-deep);font-size:13px;opacity:0.5;';
    hint.textContent='（空）';
    stage.appendChild(hint);
  }
}

/* ============ 启动 ============ */
let _resizeTimer=null;
window.addEventListener('resize',()=>{
  if(_resizeTimer)clearTimeout(_resizeTimer);
  _resizeTimer=setTimeout(()=>{
    if(currentView==='browse'&&browseChar) renderBrowseCanvas();
  },120);
});

(async function init(){
  showView('grid');
  try{
    await loadCharactersData();
    renderCharGrid();
  }catch(err){
    console.error(err);
    const tip=document.getElementById('loadingTip');
    if(tip){
      tip.innerHTML='加载 <b>characters-data.json</b> 失败：<span class="err">'+escapeHtml(err.message||String(err))+'</span><br>'
        +'<div style="font-size:12px;margin-top:10px;color:#a07a86;">'
        +'请确认：<br>'
        +'① 文件与 characters.html 在同一目录<br>'
        +'② 使用 HTTP 服务器打开（如 <code>python -m http.server</code> / VSCode Live Server / <code>npx serve</code>）<br>'
        +'③ 直接 <code>file://</code> 打开会因浏览器安全策略无法读取 JSON'
        +'</div>';
    }
  }
})();
</script>
